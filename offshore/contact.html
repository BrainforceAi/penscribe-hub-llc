<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | OffshoreLink</title><meta name="description" content="Contact our offshore recruitment team.">
<link rel="stylesheet" href="assets/styles.css"></head>
<body data-page="contact">
<div class="page-head"><div class="wrap"><h1>Contact us</h1><p>Candidates, partners and media: we'd love to hear from you.</p></div></div>
<section class="section"><div class="wrap grid g2"><div class="card"><h2>Send a message</h2>
<form data-demo="Your message has been received. We'll reply within one working day.">
<label>Name</label><input required><label>Email</label><input type="email" required>
<label>I am a</label><select><option>Job seeker</option><option>Partner company</option><option>Other</option></select>
<label>Message</label><textarea required></textarea><p><button class="btn">Send</button></p></form></div>
<div class="card"><h2>Get in touch</h2><p>📧 info@your-domain.com<br>💬 WhatsApp (button bottom right)<br>📍 [Office address]<br>🕘 Mon–Fri, 9:00–17:00</p>
<div class="notice">Beware of fraud: we never ask applicants for payment for a job.</div></div></div></section>
<script src="data/locations.js"></script><script src="data/jobs.js"></script><script src="assets/app.js"></script>
</body></html>
