name = "penscribe-hub-llc"
main = "worker.js"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Configure production secrets with `wrangler secret put`:
# RESEND_API_KEY, GOOGLE_SHEETS_WEBHOOK, FORM_TO_EMAIL, FORM_FROM_EMAIL
# Optional rate-limit KV binding:
# [[kv_namespaces]]
# binding = "LEAD_LIMIT"
# id = "..."
