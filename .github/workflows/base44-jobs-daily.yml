name: Daily job refresh (Base44 app)

# The Base44 job board refreshes itself the first time anyone opens the jobs page each day.
# This workflow makes sure that happens every day even if nobody visits, by calling the same endpoint at 05:00 UTC.
# Setup: Settings > Secrets and variables > Actions > Variables > add BASE44_SITE_URL, e.g. https://your-app.base44.app
# (the app must be published). The endpoint runs at most once a day, so repeated calls are harmless.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask the app to refresh its vacancies
        env:
          SITE: ${{ vars.BASE44_SITE_URL }}
        run: |
          if [ -z "$SITE" ]; then echo "::warning::BASE44_SITE_URL is not set, nothing to refresh"; exit 0; fi
          for attempt in 1 2 3; do
            code=$(curl -sS -m 150 -o body.txt -w "%{http_code}" -X POST "${SITE%/}/api/jobs/refresh" -H "content-type: application/json" || echo 000)
            echo "attempt $attempt -> HTTP $code: $(head -c 200 body.txt)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::The job refresh did not succeed"; exit 1
